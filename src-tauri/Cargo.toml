[package]
name = "app"
version = "1.1.0"
description = "Push_ — a semantic command center for your public GitHub footprint."
authors = ["PushUnderline Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mafhper/push_"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-os = "2"
tauri-plugin-keyring-store = { version = "0.2", default-features = false }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
